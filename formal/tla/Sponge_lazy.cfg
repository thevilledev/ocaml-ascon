\* LAZY squeeze variant (permute at the start of the next block; offset may
\* equal Rate).  Checks that it refines the same SP 800-232 output stream and
\* is permutation-minimal: PermMinimal, OpPermMinimal, HashGetMinimal.
CONSTANTS
  Rate = 2
  Domains = {d1}
  MaxOps = 4
  ChunkLens = {0, 1, 2, 3}
  SqLens = {0, 1, 2, 3}
  Alphabet = {}
  Tagged = TRUE
  Lazy = TRUE
  DigestBlocks = 4
  OpKinds = {"absorb", "finish", "squeeze", "get", "reinit"}
  MaxPerms = 100
SPECIFICATION Spec
INVARIANTS
  TypeOK
  BufferedRange OffsetRange BufferContents
  AbsorbRefinement SqueezeRefinement OutputCorrect SqueezeConcat ZeroSqueezeNoop
  AbsorbLoopInv SqueezeLoopInv
  Persistence NoWriteToPublished NoUserAliasing WritesOnlyFresh RaceFree
  AbsorbPermMinimal
  PermMinimal OpPermMinimal HashGetMinimal
