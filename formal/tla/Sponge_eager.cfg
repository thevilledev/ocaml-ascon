\* EAGER squeeze variant: the code before the lazy-permutation fix, which
\* permuted as soon as an output block was used up.  Checks that it refines the
\* same SP 800-232 output stream and that EagerExtraPermExact pins down its one
\* extra permutation per used-up block.
CONSTANTS
  Rate = 2
  Domains = {d1}
  MaxOps = 4
  ChunkLens = {0, 1, 2, 3}
  SqLens = {0, 1, 2, 3}
  Alphabet = {}
  Tagged = TRUE
  Lazy = FALSE
  DigestBlocks = 4
  OpKinds = {"absorb", "finish", "squeeze", "get", "reinit"}
  MaxPerms = 100
SPECIFICATION Spec
INVARIANTS
  TypeOK
  BufferedRange OffsetRange BufferContents
  AbsorbRefinement SqueezeRefinement OutputCorrect SqueezeConcat ZeroSqueezeNoop
  AbsorbLoopInv SqueezeLoopInv
  Persistence NoWriteToPublished NoUserAliasing WritesOnlyFresh RaceFree
  AbsorbPermMinimal
  EagerExtraPermExact
