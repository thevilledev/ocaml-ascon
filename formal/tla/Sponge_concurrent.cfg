\* Two OCaml 5 domains, each performing 2 operations on contexts from the
\* shared pool (including contexts published by the other domain), interleaved
\* at OCaml-statement granularity.  RaceFree / WritesOnlyFresh /
\* NoWriteToPublished are the data-race checks; the refinement invariants show
\* every result equals the sequential result.
CONSTANTS
  Rate = 2
  Domains = {d1, d2}
  MaxOps = 2
  ChunkLens = {0, 1, 2, 3}
  SqLens = {0, 1, 2, 3}
  Alphabet = {}
  Tagged = TRUE
  Lazy = FALSE
  DigestBlocks = 4
  OpKinds = {"absorb", "finish", "squeeze", "get", "reinit"}
  MaxPerms = 100
SPECIFICATION Spec
INVARIANTS
  TypeOK
  BufferedRange OffsetRange BufferContents
  AbsorbRefinement SqueezeRefinement OutputCorrect SqueezeConcat ZeroSqueezeNoop
  AbsorbLoopInv SqueezeLoopInv
  Persistence NoWriteToPublished NoUserAliasing WritesOnlyFresh RaceFree
  AbsorbPermMinimal EagerExtraPermExact
