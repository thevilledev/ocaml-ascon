\* Sequential, Rate = 3 (odd rate: catches Rate-2-specific coincidences such
\* as Rate - 1 = 1), distinct-symbol bytes, absorb lengths 0..6 (from any
\* buffered in 0..2: fill + a full block + tail), squeeze lengths 0..6.
CONSTANTS
  Rate = 3
  Domains = {d1}
  MaxOps = 4
  ChunkLens = {0, 1, 2, 3, 4, 5, 6}
  SqLens = {0, 1, 2, 3, 4, 5, 6}
  Alphabet = {}
  Tagged = TRUE
  Lazy = TRUE
  DigestBlocks = 4
  OpKinds = {"absorb", "finish", "squeeze", "get", "reinit"}
  MaxPerms = 100
SPECIFICATION Spec
INVARIANTS
  TypeOK
  BufferedRange OffsetRange BufferContents
  AbsorbRefinement SqueezeRefinement OutputCorrect SqueezeConcat ZeroSqueezeNoop
  AbsorbLoopInv SqueezeLoopInv
  Persistence NoWriteToPublished NoUserAliasing WritesOnlyFresh RaceFree
  AbsorbPermMinimal PermMinimal OpPermMinimal HashGetMinimal
