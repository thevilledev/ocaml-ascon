\* Sequential (one domain), Rate = 2, EXACT bytewise XOR over the byte
\* alphabet {0,1} (padding byte 0x01 collides with data byte 1, as in reality).
\* Every absorb length 0..4 (partial fill, exact fill, fill + full block +
\* tail), squeeze lengths 0..3, 3 operations over the pool of held contexts,
\* all five operations (absorb, finish, squeeze, Hash256.get, CXOF of_state
\* re-initialisation).  Also checks termination of every operation.
CONSTANTS
  Rate = 2
  Domains = {d1}
  MaxOps = 3
  ChunkLens = {0, 1, 2, 3, 4}
  SqLens = {0, 1, 2, 3}
  Alphabet = {0, 1}
  Tagged = FALSE
  Lazy = FALSE
  DigestBlocks = 4
  OpKinds = {"absorb", "finish", "squeeze", "get", "reinit"}
  MaxPerms = 100
SPECIFICATION Spec
INVARIANTS
  TypeOK
  BufferedRange OffsetRange BufferContents
  AbsorbRefinement SqueezeRefinement OutputCorrect SqueezeConcat ZeroSqueezeNoop
  AbsorbLoopInv SqueezeLoopInv
  Persistence NoWriteToPublished NoUserAliasing WritesOnlyFresh RaceFree
  AbsorbPermMinimal EagerExtraPermExact
PROPERTIES
  Termination
