\* Sequential, Rate = 2, every input byte a distinct symbol (maximally
\* discriminating for this data-independent code), 5 operations deep: long
\* enough for absorb-absorb-absorb-finish-squeeze and for finish followed by
\* three squeezes (exercising SqueezeConcat), with branching over the pool.
CONSTANTS
  Rate = 2
  Domains = {d1}
  MaxOps = 5
  ChunkLens = {0, 1, 2, 3}
  SqLens = {0, 1, 2, 3}
  Alphabet = {}
  Tagged = TRUE
  Lazy = TRUE
  DigestBlocks = 4
  OpKinds = {"absorb", "finish", "squeeze", "get", "reinit"}
  MaxPerms = 100
SPECIFICATION Spec
INVARIANTS
  TypeOK
  BufferedRange OffsetRange BufferContents
  AbsorbRefinement SqueezeRefinement OutputCorrect SqueezeConcat ZeroSqueezeNoop
  AbsorbLoopInv SqueezeLoopInv
  Persistence NoWriteToPublished NoUserAliasing WritesOnlyFresh RaceFree
  AbsorbPermMinimal PermMinimal OpPermMinimal HashGetMinimal
