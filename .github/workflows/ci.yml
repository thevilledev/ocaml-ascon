name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Avrea Linux / OCaml ${{ matrix.ocaml-compiler }}
    runs-on: avrea-ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ocaml-compiler: ["4.14.x", "5.2.x", "5.4.x", "5.5.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          dune-cache: true
      - run: opam install . --deps-only --with-test --with-doc
      - run: opam exec -- dune build @all
      - run: opam exec -- dune runtest --no-buffer
      - run: opam exec -- dune build @doc

  macos:
    name: GitHub macOS / OCaml 5.5
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5.x"
          dune-cache: true
      - run: opam install . --deps-only --with-test --with-doc
      - run: opam exec -- dune build @all
      - run: opam exec -- dune runtest --no-buffer
      - run: opam exec -- dune build @doc
